<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1312"/>
      <stop offset="50%" stop-color="#0c1917"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="12" fill="url(#wfBg)" stroke="#163832" stroke-width="2"/>

  <rect x="60" y="50" width="280" height="140" rx="10" fill="#081e1a" stroke="#2ea44f" stroke-width="2"/>
  <text x="200" y="85" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. PRE-COMMIT</text>
  <text x="200" y="120" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">Whitespace Check</text>
  <text x="200" y="145" fill="#3fb950" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">18 Preflight Constraints</text>
  <text x="200" y="170" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">Blocks commit on fail</text>

  <rect x="460" y="50" width="280" height="140" rx="10" fill="#081e1a" stroke="#2ea44f" stroke-width="2"/>
  <text x="600" y="85" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. COMMIT-MSG</text>
  <text x="600" y="120" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">Structured Rationale</text>
  <text x="600" y="145" fill="#ffd166" font-family="monospace" font-size="13" text-anchor="middle">- path/file: Reason</text>
  <text x="600" y="170" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">Strict per-file check</text>

  <rect x="860" y="50" width="280" height="140" rx="10" fill="#081e1a" stroke="#2ea44f" stroke-width="2"/>
  <text x="1000" y="85" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. POST-COMMIT</text>
  <text x="1000" y="120" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">Auto-Push origin/main</text>
  <text x="1000" y="145" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Instant Deployment</text>
  <text x="1000" y="170" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">No bypass allowed</text>

  <line x1="340" y1="120" x2="460" y2="120" stroke="#3fb950" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="740" y1="120" x2="860" y2="120" stroke="#3fb950" stroke-width="3" stroke-dasharray="6,4"/>
</svg>
